name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  # Unit tests pass on a package published without its templates and on a server
  # entry that cannot start. Both have shipped. The smoke test builds and boots a
  # real scaffolded app, and publishing is gated on it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      - name: Run tests
        run: npm test

      # The smoke test regenerates the committed declarations to check they
      # still match the JSDoc, which needs the framework's own tsc and React
      # types. Publishing stale types is silent otherwise.
      - name: Install dev dependencies
        run: npm ci

      # The end-to-end smoke test moved to the basicben monorepo with the CMS
      # it drives, so releases here are gated on the unit suite. That is a
      # genuine reduction: unit tests pass on a package published without its
      # templates and on a server entry that cannot start, both of which have
      # shipped before. basicben runs the smoke test against the published
      # version after release.
      - name: Unit tests
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @basicbenframework/core
        run: npm publish --access public --provenance

      # @basicbenframework/create is published from the basicben monorepo now:
      # it bundles the CMS, and the CMS lives there.
