name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  # The end-to-end smoke test moved to BasicBenFramework/basicben with the CMS
  # it drives, so a release here is gated on the unit suite and the declaration
  # checks rather than on booting a real app. That is a genuine reduction: unit
  # tests pass on a package published without its templates and on a server
  # entry that cannot start, and both have shipped before. basicben runs the
  # smoke test against the published version, which catches the same class of
  # problem after release instead of before it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      # tsc and the React types, for the declaration checks below.
      - name: Install dev dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Publishing stale or malformed declarations is otherwise silent: apps
      # compile with skipLibCheck, so a broken .d.ts still lets them build.
      - name: Declarations are current and self-consistent
        run: npm run check:types

      # The scaffolder is published from here too. It downloads the CMS, so this
      # needs network access and runs against that repository's default branch.
      - name: The scaffolder produces a usable project
        run: npm run check:scaffolder

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @basicbenframework/core
        run: npm publish --access public --provenance

      # The scaffolder lives here again. It used to bundle a copy of the CMS at
      # pack time, which is why it had to sit in the CMS repository; it
      # downloads at run time now, so it is a standalone one-file CLI with no
      # dependencies and no build step, and publishes from wherever it lives.
      - name: Publish @basicbenframework/create
        working-directory: ./create
        run: npm publish --access public --provenance
