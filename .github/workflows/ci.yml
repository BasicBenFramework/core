name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      # No install: the framework has zero runtime dependencies, so its own
      # suite runs against a bare checkout.
      - name: Run tests
        run: npm test

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      # This one needs tsc and the React types, so it installs.
      - name: Install dev dependencies
        run: npm ci

      # The committed declarations are generated from JSDoc. An edit that skips
      # `npm run build:types` ships types describing the previous version, and a
      # malformed .d.ts still lets every app compile because apps use
      # skipLibCheck. Both have happened.
      - name: Declarations are current and self-consistent
        run: npm run check:types

      # The scaffolder is published from here too. It downloads the CMS, so this
      # needs network access and runs against that repository's default branch.
      - name: The scaffolder produces a usable project
        run: npm run check:scaffolder

  # The end-to-end smoke test lives in BasicBenFramework/basicben with the CMS
  # it drives. It runs against the published framework, so it covers a release
  # after the fact rather than gating it — the trade made when the CMS moved out.
